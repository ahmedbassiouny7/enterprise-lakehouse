# Enterprise Lakehouse Docker Compose stack.
# Requires the extra Spark/Iceberg jars from docker/spark-jars before first launch.
#
# The three hadoop-hive-spark-* images are local-only (no upstream registry —
# see docs/design-decisions.md, "Adopting Ahmed's existing images"), so they
# can't be pinned to a published version. Pinned to :v1 here instead of
# :latest so a later rebuild can't silently swap out what's running without
# a deliberate tag bump. One-time setup if you haven't already:
#   docker tag hadoop-hive-spark-master:latest  hadoop-hive-spark-master:v1
#   docker tag hadoop-hive-spark-worker:latest  hadoop-hive-spark-worker:v1
#   docker tag hadoop-hive-spark-history:latest hadoop-hive-spark-history:v1

x-airflow-common: &airflow-common
  build: ./docker/airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    SPARK_HOME: /opt/spark
    PATH: /opt/spark/bin:${PATH}
    # Airflow uses these standard connections for validation and Spark submission.
    AIRFLOW_CONN_TRINO_DEFAULT: trino://airflow@trino:8080
    AIRFLOW_CONN_SPARK_DEFAULT: spark://master:7077
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark/jobs:/opt/airflow/spark_jobs
    - airflow_logs:/opt/airflow/logs
  networks: [lakehouse-net]
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  # Hadoop/Spark/Hive master container with Hive Metastore.
  master:
    image: hadoop-hive-spark-master:v1
    container_name: master
    hostname: master
    environment:
      - SPARK_MASTER_HOST=${SPARK_MASTER_HOST}   # not baked in — image needs this passed at runtime
    ports:
      - "${NAMENODE_UI_PORT}:9870"     # HDFS NameNode web UI
      - "${SPARK_MASTER_UI_PORT}:8080" # Spark Master web UI
      - "${SPARK_MASTER_RPC_PORT}:7077" # Spark Master RPC (workers + spark-submit connect here)
      - "${HIVE_METASTORE_THRIFT_PORT}:9083" # Hive Metastore (Trino + Spark catalog reads)
      - "${HIVESERVER2_PORT}:10000"    # HiveServer2 (beeline / JDBC clients)
    volumes:
      - namenode_data:/opt/hadoop/dfs/name
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./docker/spark-jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar:/opt/spark/jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar:ro
      - ./docker/spark-jars/mysql-connector-j-8.4.0.jar:/opt/spark/jars/mysql-connector-j-8.4.0.jar:ro
      - ./spark/jobs:/opt/spark-jobs
      # Flat-file Bronze sources (products.csv, exchange_rates.csv) written by
      # data-generator. Read-only: Bronze jobs consume these, never write here.
      - ./generator/output:/opt/spark-jobs-data:ro
    networks: [lakehouse-net]
    depends_on:
      metastore:
        condition: service_healthy
    # Wait until Hive Metastore thrift is accepting connections.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9083' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # Flat keys instead of deploy.resources.limits: deploy: is only
    # guaranteed honored by plain `docker compose up` on the newer
    # Compose V2 CLI — older `docker-compose` (V1) silently ignores it.
    # This is local-only Compose, no Swarm involved, so mem_limit/cpus
    # apply unambiguously regardless of which Compose you're running.
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped

  # Spark worker container.
  worker:
    image: hadoop-hive-spark-worker:v1
    container_name: worker
    hostname: worker
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - datanode_data:/opt/hadoop/dfs/data
      - ./docker/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./docker/spark-jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar:/opt/spark/jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar:ro
      - ./docker/spark-jars/mysql-connector-j-8.4.0.jar:/opt/spark/jars/mysql-connector-j-8.4.0.jar:ro
      - ./generator/output:/opt/spark-jobs-data:ro
    networks: [lakehouse-net]
    depends_on:
      master:
        condition: service_healthy
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped

  history:
    image: hadoop-hive-spark-history:v1
    container_name: history
    ports:
      - "${SPARK_HISTORY_UI_PORT}:18080"
    volumes:
      - ./docker/spark-jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar:/opt/spark/jars/iceberg-spark-runtime-3.3_2.12-1.4.3.jar:ro
      - ./docker/spark-jars/mysql-connector-j-8.4.0.jar:/opt/spark/jars/mysql-connector-j-8.4.0.jar:ro
    networks: [lakehouse-net]
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped

  # Hive Metastore database.
  metastore:
    image: postgres:15.8
    container_name: metastore
    environment:
      - POSTGRES_DB=${METASTORE_DB}
      - POSTGRES_USER=${METASTORE_USER}
      - POSTGRES_PASSWORD=${METASTORE_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=md5
    command: ["postgres", "-c", "password_encryption=md5"]
    ports:
      - "${METASTORE_PORT}:5432"
    volumes:
      - metastore_db_data:/var/lib/postgresql/data
    networks: [lakehouse-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METASTORE_USER} -d ${METASTORE_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------
  # Operational source systems (what the pipeline reads FROM)
  # --------------------------------------------------------------------
  postgres-orders:
    image: postgres:15.8
    container_name: postgres-orders
    environment:
      - POSTGRES_DB=${POSTGRES_ORDERS_DB}
      - POSTGRES_USER=${POSTGRES_ORDERS_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ORDERS_PASSWORD}
    ports:
      - "${POSTGRES_ORDERS_PORT}:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    networks: [lakehouse-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ORDERS_USER} -d ${POSTGRES_ORDERS_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql-customers:
    image: mysql:8.0.39
    container_name: mysql-customers
    environment:
      - MYSQL_DATABASE=${MYSQL_CUSTOMERS_DB}
      - MYSQL_USER=${MYSQL_CUSTOMERS_USER}
      - MYSQL_PASSWORD=${MYSQL_CUSTOMERS_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_CUSTOMERS_PORT}:3306"
    volumes:
      - mysql_customers_data:/var/lib/mysql
    networks: [lakehouse-net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --------------------------------------------------------------------
  # data-generator — one-shot job container. Generates the synthetic
  # dataset (Faker/numpy, seed 42, correlated distributions) and loads it
  # directly into postgres-orders and mysql-customers over lakehouse-net.
  # Not a long-running service: it runs once, exits 0, and sits stopped
  # (same pattern as airflow-init below). Re-run any time with:
  #   docker compose run --rm data-generator
  # products.csv / exchange_rates.csv (flat-file/API sources, not live
  # DB tables) land in ./generator/output on the host via the volume mount.
  # --------------------------------------------------------------------
  data-generator:
    build: ./generator
    container_name: data-generator
    environment:
      GEN_SEED: "42"
      GEN_N_CUSTOMERS: "10000"
      GEN_N_PRODUCTS: "2000"
      GEN_N_ORDERS: "100000"
      GEN_START_DATE: "2024-01-01"
      GEN_END_DATE: "2025-12-31"
      GEN_OUTPUT_DIR: "/data/output"

      ORDERS_DB_HOST: postgres-orders
      ORDERS_DB_PORT: "5432"
      ORDERS_DB_NAME: ${POSTGRES_ORDERS_DB}
      ORDERS_DB_USER: ${POSTGRES_ORDERS_USER}
      ORDERS_DB_PASSWORD: ${POSTGRES_ORDERS_PASSWORD}

      CUSTOMERS_DB_HOST: mysql-customers
      CUSTOMERS_DB_PORT: "3306"
      CUSTOMERS_DB_NAME: ${MYSQL_CUSTOMERS_DB}
      CUSTOMERS_DB_USER: ${MYSQL_CUSTOMERS_USER}
      CUSTOMERS_DB_PASSWORD: ${MYSQL_CUSTOMERS_PASSWORD}
    volumes:
      - ./generator/output:/data/output
    networks: [lakehouse-net]
    restart: "no"
    depends_on:
      postgres-orders:
        condition: service_healthy
      mysql-customers:
        condition: service_healthy

  # --------------------------------------------------------------------
  # Trino — unified SQL / data-virtualization endpoint
  # --------------------------------------------------------------------
  trino:
    image: trinodb/trino:465
    container_name: trino
    environment:
      - POSTGRES_ORDERS_USER=${POSTGRES_ORDERS_USER}
      - POSTGRES_ORDERS_PASSWORD=${POSTGRES_ORDERS_PASSWORD}
      - MYSQL_CUSTOMERS_USER=${MYSQL_CUSTOMERS_USER}
      - MYSQL_CUSTOMERS_PASSWORD=${MYSQL_CUSTOMERS_PASSWORD}
    ports:
      - "${TRINO_PORT}:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog
      - ./docker/hadoop:/etc/trino/catalog/hadoop-conf:ro
    networks: [lakehouse-net]
    depends_on:
      master:
        condition: service_healthy
      postgres-orders:
        condition: service_healthy
      mysql-customers:
        condition: service_healthy
    # Trino's own readiness endpoint. Assumes curl is present in the
    # trinodb/trino image (it is, as of trino:465) — verify with
    # `docker exec trino curl -sf http://localhost:8080/v1/info` if this
    # image version ever changes.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------
  # Airflow — orchestration. LocalExecutor + its own Postgres metadata DB.
  # Custom image built FROM apache/airflow:2.9.3 (already cached locally)
  # adding the Spark/Trino providers — see docker/airflow/Dockerfile.
  # --------------------------------------------------------------------
  airflow-db:
    image: postgres:15.8
    container_name: airflow-db
    environment:
      - POSTGRES_DB=${AIRFLOW_DB}
      - POSTGRES_USER=${AIRFLOW_DB_USER}
      - POSTGRES_PASSWORD=${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks: [lakehouse-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    # Airflow's own recommended webserver healthcheck (curl against /health).
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./spark/jobs:/opt/airflow/spark_jobs
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    # Airflow's own documented scheduler healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$(hostname)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    # Airflow's own documented triggerer healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$$(hostname)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  lakehouse-net:
    driver: bridge

volumes:
  namenode_data:
  datanode_data:
  metastore_db_data:
  postgres_orders_data:
  mysql_customers_data:
  airflow_db_data:
  airflow_logs: