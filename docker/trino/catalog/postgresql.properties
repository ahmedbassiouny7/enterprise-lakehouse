# Live pass-through to the operational orders database. No data is copied —
# Trino pushes SQL down to Postgres at query time. This is what lets a
# single query join today's raw operational orders against Gold customer
# metrics without an ETL job in between. See docs/design-decisions.md,
# "ETL vs virtualization: when to move data vs. query it in place".
connector.name=postgresql
connection-url=jdbc:postgresql://postgres-orders:5432/orders_db
connection-user=${ENV:POSTGRES_ORDERS_USER}
connection-password=${ENV:POSTGRES_ORDERS_PASSWORD}
