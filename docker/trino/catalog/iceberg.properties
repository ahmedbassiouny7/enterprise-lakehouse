# Exposes bronze/silver/gold Iceberg tables to Trino as catalog "iceberg".
# hive.metastore.uri points at `master`, because in Ahmed's existing
# hadoop-hive-spark-master image, Hive Metastore runs as a background
# process inside the same container as the HDFS NameNode and Spark Master
# (see docker/spark-jars/README.md and docs/design-decisions.md for the
# full reverse-engineered wiring). Enabling Hadoop filesystem support makes
# hive.config.resources available in Trino 465, then gives Trino the same
# fs.defaultFS=hdfs://master + replication config the cluster itself uses.
connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=thrift://master:9083
fs.hadoop.enabled=true
hive.config.resources=/etc/trino/catalog/hadoop-conf/core-site.xml,/etc/trino/catalog/hadoop-conf/hdfs-site.xml
