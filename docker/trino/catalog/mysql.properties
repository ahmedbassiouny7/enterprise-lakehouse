# Live pass-through to the operational customers database — same rationale
# as postgresql.properties. Together with iceberg.properties, this gives
# Trino three catalogs it can join across in a single query: mysql,
# postgresql, and iceberg (bronze/silver/gold schemas).
connector.name=mysql
connection-url=jdbc:mysql://mysql-customers:3306
connection-user=${ENV:MYSQL_CUSTOMERS_USER}
connection-password=${ENV:MYSQL_CUSTOMERS_PASSWORD}
